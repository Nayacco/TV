name: FluxDown draft APK

on:
  push:
    branches:
      - codex/fluxdown-cache

permissions:
  contents: read

concurrency:
  group: fluxdown-draft-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      build_type: ${{ steps.signing.outputs.build_type }}
      signing_label: ${{ steps.signing.outputs.signing_label }}
      signing_persistent: ${{ steps.signing.outputs.signing_persistent }}
      fluxdown_sha: ${{ steps.collect.outputs.fluxdown_sha }}
    env:
      NDK_VERSION: "28.2.13676358"

    steps:
      - name: Check out source and FluxDown
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chaquo/requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

          if [[ ! -e "${ANDROID_HOME}/platforms/android-37" ]]; then
            test -d "${ANDROID_HOME}/platforms/android-37.0"
            ln -s "${ANDROID_HOME}/platforms/android-37.0" "${ANDROID_HOME}/platforms/android-37"
          fi

          ndk_home="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -f "${ndk_home}/source.properties"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Android FFmpeg executables and corresponding source
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/jniLibs
            build/ffmpeg/assets
            build/ffmpeg/distribution
          key: android-ffmpeg-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}

      - name: Build Android FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android-ffmpeg.sh \
            --ndk "${ANDROID_NDK_HOME}" \
            --output "${GITHUB_WORKSPACE}/build/ffmpeg"

      - name: Verify Android FFmpeg build outputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            test -s "build/ffmpeg/jniLibs/${abi}/libffmpeg.so"
            test -s "build/ffmpeg/assets/ffmpeg/BUILD-${abi}.txt"
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
              --file-header "build/ffmpeg/jniLibs/${abi}/libffmpeg.so"
          done
          test -s build/ffmpeg/assets/ffmpeg/COPYING.LGPLv2.1
          test -s build/ffmpeg/assets/ffmpeg/LICENSE.md
          test -s build/ffmpeg/distribution/ffmpeg-8.0.3.tar.xz
          test -s build/ffmpeg/distribution/ffmpeg-8.0.3.tar.xz.asc
          test -s build/ffmpeg/distribution/FFmpeg-NOTICE.txt
          cmp scripts/build-android-ffmpeg.sh build/ffmpeg/distribution/build-android-ffmpeg.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fluxdown -> target
          cache-on-failure: true
          key: fluxdown-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Configure optimized release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_values=0
          [[ -n "${ANDROID_KEYSTORE_BASE64}" ]] && signing_values=$((signing_values + 1))
          [[ -n "${ANDROID_KEY_ALIAS}" ]] && signing_values=$((signing_values + 1))
          [[ -n "${ANDROID_STORE_PASSWORD}" ]] && signing_values=$((signing_values + 1))

          if [[ "${signing_values}" -eq 3 ]]; then
            keystore="${RUNNER_TEMP}/release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            test -s "${keystore}"
            key_alias="${ANDROID_KEY_ALIAS}"
            store_password="${ANDROID_STORE_PASSWORD}"
            build_type="release"
            signing_label="repository release key"
            signing_persistent="true"
          elif [[ "${signing_values}" -eq 0 ]]; then
            keystore="${RUNNER_TEMP}/ephemeral-release.p12"
            key_alias="ci-release"
            store_password="$(openssl rand -hex 24)"
            export FLUXDOWN_CI_KEY_PASSWORD="${store_password}"
            keytool -genkeypair \
              -keystore "${keystore}" \
              -storetype PKCS12 \
              -storepass:env FLUXDOWN_CI_KEY_PASSWORD \
              -keypass:env FLUXDOWN_CI_KEY_PASSWORD \
              -alias "${key_alias}" \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -dname "CN=Ephemeral CI Build, OU=GitHub Actions"
            unset FLUXDOWN_CI_KEY_PASSWORD
            test -s "${keystore}"
            build_type="release"
            signing_label="runner-generated ephemeral release key"
            signing_persistent="false"
            echo "::warning::Signing secrets are not configured; publishing an optimized release APK signed with a one-run key. It cannot upgrade builds from another run."
          else
            echo "::error::Configure all three signing secrets or remove all of them: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_STORE_PASSWORD."
            exit 1
          fi

          python - "${ANDROID_HOME}" "${ANDROID_NDK_HOME}" "${keystore}" "${key_alias}" "${store_password}" <<'PY'
          import sys

          def escape(value: str) -> str:
              return (value.replace("\\", "\\\\")
                           .replace("\n", "\\n")
                           .replace("\r", "\\r")
                           .replace("=", "\\=")
                           .replace(":", "\\:")
                           .replace("#", "\\#")
                           .replace("!", "\\!"))

          keys = ("sdk.dir", "ndk.dir", "storeFile", "keyAlias", "storePassword")
          values = sys.argv[1:]
          with open("local.properties", "w", encoding="ISO-8859-1", newline="\n") as handle:
              for key, value in zip(keys, values, strict=True):
                  handle.write(f"{key}={escape(value)}\n")
          PY

          echo "BUILD_TYPE=${build_type}" >> "${GITHUB_ENV}"
          echo "SIGNING_LABEL=${signing_label}" >> "${GITHUB_ENV}"
          echo "build_type=${build_type}" >> "${GITHUB_OUTPUT}"
          echo "signing_label=${signing_label}" >> "${GITHUB_OUTPUT}"
          echo "signing_persistent=${signing_persistent}" >> "${GITHUB_OUTPUT}"

      - name: Test cache contracts and build optimized release APKs
        shell: bash
        run: |
          set +e
          gradle_log="${RUNNER_TEMP}/gradle.log"

          ./gradlew --no-daemon --console=plain \
            -Pfluxdown.ffmpegDir="${GITHUB_WORKSPACE}/build/ffmpeg/jniLibs" \
            :app:testLeanbackDebugUnitTest \
            :app:assembleLeanbackRelease \
            :app:assembleMobileRelease \
            2>&1 | tee "${gradle_log}"
          gradle_status="${PIPESTATUS[0]}"

          if [[ "${gradle_status}" -ne 0 ]]; then
            diagnostic="$(
              grep -E -B2 -A6 \
                '(^FAILURE:|^\* What went wrong:|^Execution failed for task|^> Task .* FAILED|(^|[[:space:]])(e:|error:|Caused by:)|Could not |Compilation error)' \
                "${gradle_log}" |
              tail -n 160 |
              head -c 12000
            )"

            if [[ -z "${diagnostic}" ]]; then
              diagnostic="$(tail -n 80 "${gradle_log}" | head -c 12000)"
            fi

            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error file=.github/workflows/fluxdown-draft-apk.yml,title=Gradle build failed::${diagnostic}"
          fi

          exit "${gradle_status}"

      - name: Collect and verify APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find Release/apk -maxdepth 1 -type f -name '*.apk' -exec cp '{}' dist/ ';'

          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 4 ]]; then
            printf 'Expected 4 APKs, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:7}"
          for apk in "${apks[@]}"; do
            name="$(basename "${apk}" .apk)"
            output="dist/${name}-${short_sha}.apk"
            mv "${apk}" "${output}"
            "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${output}"
            python - "${output}" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              entries = archive.namelist()
              ffmpeg = [name for name in entries if name.startswith("lib/") and name.endswith("/libffmpeg.so")]
              if len(ffmpeg) != 1 or archive.getinfo(ffmpeg[0]).file_size == 0:
                  raise SystemExit(f"Expected one nonempty ABI-specific FFmpeg executable in {apk}, found {ffmpeg}")
              for notice in ("COPYING.LGPLv2.1", "LICENSE.md", "BUILD.txt"):
                  name = f"assets/ffmpeg/{notice}"
                  if name not in entries or archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"Missing FFmpeg notice {name} in {apk}")
              print(f"Verified bundled FFmpeg: {apk}: {ffmpeg[0]}")
          PY
          done

          cp build/ffmpeg/distribution/* dist/
          fluxdown_sha="$(git -C rust/fluxdown rev-parse HEAD)"
          cat > dist/SOURCE.txt <<EOF
          Root source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          Root commit: ${GITHUB_SHA}
          FluxDown source: https://github.com/zerx-lab/FluxDown/tree/${fluxdown_sha}
          FluxDown commit: ${fluxdown_sha}
          FluxDown license: https://github.com/zerx-lab/FluxDown/blob/${fluxdown_sha}/LICENSE
          FFmpeg source: https://ffmpeg.org/releases/ffmpeg-8.0.3.tar.xz
          FFmpeg source, signature, pinned signing key, LGPL license and build script: included in these release assets
          EOF
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          echo "fluxdown_sha=${fluxdown_sha}" >> "${GITHUB_OUTPUT}"
          ls -lh dist

      - name: Pass APKs to release job
        uses: actions/upload-artifact@v7
        with:
          name: fluxdown-apks-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ffmpeg-smoke:
    name: Verify FFmpeg inside Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Check out smoke test and FFmpeg build script
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
          java-package: jdk
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install smoke test Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          if [[ ! -e "${ANDROID_HOME}/platforms/android-37" ]]; then
            test -d "${ANDROID_HOME}/platforms/android-37.0"
            ln -s "${ANDROID_HOME}/platforms/android-37.0" "${ANDROID_HOME}/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          chmod +x gradlew

      - name: Cache FFmpeg emulator executable
        id: ffmpeg-smoke-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg-smoke/jniLibs
            build/ffmpeg-smoke/assets
            build/ffmpeg-smoke/distribution
          key: android-ffmpeg-smoke-x86_64-${{ runner.os }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}

      - name: Build FFmpeg for Android emulator
        if: steps.ffmpeg-smoke-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android-ffmpeg.sh \
            --ndk "${ANDROID_NDK_HOME}" \
            --output "${GITHUB_WORKSPACE}/build/ffmpeg-smoke" \
            --abis x86_64

      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify offline FFmpeg merging on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/test-android-ffmpeg.sh "${GITHUB_WORKSPACE}/build/ffmpeg-smoke/jniLibs"

      - name: Record Android FFmpeg verification
        shell: bash
        run: |
          {
            echo "### Android FFmpeg smoke test"
            echo
            echo "Passed in an Android 10 (API 29) app targeting API 37: nativeLibraryDir execution, separated audio/video MP4 merge, and MPEG-TS to MP4 remux."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve Android smoke test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ffmpeg-smoke-${{ github.sha }}
          path: |
            build/ffmpeg-smoke/logs/
            tests/ffmpeg-smoke/**/build/reports/
            tests/ffmpeg-smoke/**/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Create draft release
    needs: [build, ffmpeg-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      BUILD_TYPE: ${{ needs.build.outputs.build_type }}
      SIGNING_LABEL: ${{ needs.build.outputs.signing_label }}
      SIGNING_PERSISTENT: ${{ needs.build.outputs.signing_persistent }}
      FLUXDOWN_SHA: ${{ needs.build.outputs.fluxdown_sha }}

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: fluxdown-apks-${{ github.sha }}
          path: dist

      - name: Create or update draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="fluxdown-cache-${GITHUB_SHA}"
          short_sha="${GITHUB_SHA:0:7}"
          title="FluxDown cache ${short_sha}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${SIGNING_PERSISTENT}" == "true" ]]; then
            install_note="Release signing uses the repository signing secrets and supports normal upgrades."
          else
            install_note="This optimized release uses a new ephemeral key for this run; uninstall an older draft build before installing this one."
          fi

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Automated draft build from \`${GITHUB_REF_NAME}\`.

          - Commit: \`${GITHUB_SHA}\`
          - Build type: \`${BUILD_TYPE}\`
          - Signing: ${SIGNING_LABEL}
          - Installation: ${install_note}
          - Workflow run: ${run_url}
          - FluxDown source: https://github.com/zerx-lab/FluxDown/tree/${FLUXDOWN_SHA}

          Assets contain the TV and mobile APKs for arm64-v8a and armeabi-v7a. Verify downloads with \`SHA256SUMS.txt\`.
          FFmpeg 8.0.3 is bundled for offline media merging. Its corresponding source archive, signature, pinned release key, LGPL license, notices and Android build script are also included as assets.
          EOF

          if existing_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${existing_draft}" != "true" ]]; then
              echo "::error::Release ${tag} already exists and is not a draft."
              exit 1
            fi
            gh release edit "${tag}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "${tag}" \
              --draft \
              --latest=false \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

          for attempt in {1..10}; do
            if gh release view "${tag}" >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" -eq 10 ]]; then
              echo "::error::Draft release ${tag} did not become available."
              exit 1
            fi
            sleep 2
          done

          gh release upload "${tag}" dist/* --clobber

          release_json="$(gh release view "${tag}" --json isDraft,targetCommitish,assets,url)"
          [[ "$(jq -r '.isDraft' <<< "${release_json}")" == "true" ]]
          [[ "$(jq -r '.targetCommitish' <<< "${release_json}")" == "${GITHUB_SHA}" ]]
          [[ "$(jq '[.assets[] | select(.name | endswith(".apk"))] | length' <<< "${release_json}")" -eq 4 ]]
          for required_asset in ffmpeg-8.0.3.tar.xz ffmpeg-8.0.3.tar.xz.asc ffmpeg-devel.asc \
            COPYING.LGPLv2.1 FFmpeg-LICENSE.md FFmpeg-NOTICE.txt build-android-ffmpeg.sh \
            FFmpeg-BUILD-arm64-v8a.txt FFmpeg-BUILD-armeabi-v7a.txt SHA256SUMS.txt SOURCE.txt; do
            jq --arg name "${required_asset}" --exit-status \
              'any(.assets[]; .name == $name and .size > 0)' <<< "${release_json}" >/dev/null
          done

          release_url="$(jq -r '.url' <<< "${release_json}")"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Draft APK release"
            echo
            echo "- ${release_url}"
            echo "- Build type: ${BUILD_TYPE}"
            echo "- Signing: ${SIGNING_LABEL}"
          } >> "${GITHUB_STEP_SUMMARY}"
